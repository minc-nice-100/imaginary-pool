version: '3.8'

services:
  imaginary-pool:
    build: .
    ports:
      - "8080:8080"
    environment:
      - POOL_SIZE=3
      - H2O_PORT=8080
      - IMAGINARY_PORT=9000
      # 可选的imaginary配置，例如：
      # - IMAGINARY_CONFIG="-concurrency 10 -max-scale 2.0"
    volumes:
      - ./logs:/var/log/h2o
    restart: unless-stopped